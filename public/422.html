<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Unprocessable content — TripSplit</title>
  <meta name="viewport" content="initial-scale=1, width=device-width">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f6fb; color: #334155; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; background: linear-gradient(135deg, #1d4ed8 0%, #6d28d9 55%, #0ea5e9 100%); }
    .card { background: #ffffff; border-radius: 32px; max-width: 480px; width: 100%; padding: 3rem 2.5rem; text-align: center; box-shadow: 0 24px 60px rgba(15, 23, 42, 0.25); }
    .brand { display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 1.15rem; color: #0f172a; margin-bottom: 2rem; }
    .brand-mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
    .code { font-size: 4.5rem; font-weight: 800; line-height: 1; background: linear-gradient(135deg, #f59e0b 0%, #e11d48 100%); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 0.75rem; }
    .icon-wrap { width: 84px; height: 84px; border-radius: 50%; background: #fff7ed; color: #f59e0b; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1.25rem; }
    h1 { font-size: 1.35rem; color: #0f172a; margin-bottom: 0.5rem; }
    p { color: #64748b; margin-bottom: 2rem; font-size: 0.95rem; }
    .btn { display: inline-flex; align-items: center; gap: 0.4rem; background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); color: #fff; text-decoration: none; font-weight: 600; padding: 0.75rem 1.5rem; border-radius: 12px; box-shadow: 0 12px 28px rgba(37, 99, 235, 0.25); }
  </style>
</head>
<body>
  <div class="card">
    <span class="brand"><span class="brand-mark"><i class="bi bi-wallet2"></i></span> TripSplit</span>
    <div class="icon-wrap"><i class="bi bi-exclamation-triangle-fill"></i></div>
    <div class="code">422</div>
    <h1>Something about that request wasn't right</h1>
    <p>Your change was rejected, possibly because of an expired session. Please go back and try again.</p>
    <a href="/" class="btn"><i class="bi bi-house-door-fill"></i> Back to TripSplit</a>
  </div>
</body>
</html>
